<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vibe Coding 规范化操作 · 个人工作台 Demo</title>
  <style>
    :root {
      --ink: #121719;
      --ink-soft: #1b2225;
      --panel: #202a2d;
      --panel-2: #263236;
      --line: #3a484b;
      --muted: #9caeb0;
      --text: #edf4f2;
      --teal: #42d2ae;
      --teal-dark: #163e38;
      --coral: #f28b69;
      --yellow: #f6c85f;
      --blue: #8fb9ff;
      --danger: #f07d81;
      --radius: 7px;
      --shadow: 0 16px 40px rgba(0, 0, 0, .22);
      --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--ink); color: var(--text); font-family: var(--sans); }
    body { min-width: 320px; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

    .app-shell { min-height: 100vh; display: grid; grid-template-columns: 236px minmax(0, 1fr); }
    .sidebar { border-right: 1px solid var(--line); padding: 24px 16px; display: flex; flex-direction: column; gap: 24px; background: #151c1e; }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 10px; }
    .brand-mark { width: 28px; height: 28px; display: grid; place-items: center; background: var(--teal); color: var(--ink); font-weight: 900; border-radius: 6px; }
    .brand-title { font-size: 14px; font-weight: 750; letter-spacing: .02em; }
    .brand-sub { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .nav-label, .eyebrow { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .12em; }
    .nav { display: grid; gap: 5px; }
    .nav button { border: 0; background: transparent; color: var(--muted); border-radius: 6px; text-align: left; padding: 10px 12px; display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .nav button:hover, .nav button.active { color: var(--text); background: var(--panel); }
    .nav-dot { width: 7px; height: 7px; border: 1px solid currentColor; border-radius: 50%; }
    .nav button.active .nav-dot { background: var(--teal); border-color: var(--teal); }
    .assignment { margin-top: auto; border-top: 1px solid var(--line); padding: 18px 10px 0; }
    .assignment strong { display: block; margin: 7px 0 9px; font-size: 13px; line-height: 1.45; }
    .assignment p { color: var(--muted); font-size: 11px; line-height: 1.55; margin: 0; }
    .mini-progress { height: 4px; background: var(--panel-2); border-radius: 999px; overflow: hidden; margin-top: 14px; }
    .mini-progress span { display: block; width: 25%; height: 100%; background: var(--teal); transition: width .25s ease; }

    .main { min-width: 0; padding: 24px 30px 36px; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 22px; }
    .topbar h1 { margin: 4px 0 0; font-size: clamp(22px, 3vw, 34px); letter-spacing: -.02em; line-height: 1.08; }
    .topbar p { margin: 9px 0 0; color: var(--muted); font-size: 13px; }
    .top-actions { display: flex; align-items: center; gap: 9px; }
    .mode { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 6px; padding: 9px 12px; font-size: 12px; }
    .mode-label { color: var(--muted); margin-right: 4px; }
    .primary { border: 0; background: var(--teal); color: #09241e; font-weight: 800; border-radius: 6px; padding: 10px 14px; font-size: 12px; }
    .primary:hover { background: #5ce0be; }
    .secondary { border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 6px; padding: 9px 12px; font-size: 12px; }
    .secondary:hover { border-color: var(--teal); color: var(--teal); }

    .stage-rail { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 20px; }
    .stage { position: relative; border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--muted); text-align: left; padding: 14px 15px 13px; min-height: 74px; }
    .stage:last-child { border-right: 0; }
    .stage:hover { background: rgba(66, 210, 174, .06); }
    .stage.active { background: var(--teal-dark); color: var(--text); }
    .stage.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: var(--teal); }
    .stage-num { font-family: var(--mono); font-size: 11px; color: var(--teal); }
    .stage-name { display: block; margin-top: 8px; font-size: 14px; font-weight: 750; }
    .stage-hint { display: block; margin-top: 4px; font-size: 11px; color: inherit; opacity: .72; }

    .content-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(280px, .8fr); gap: 18px; align-items: start; }
    .panel { min-width: 0; border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow); }
    .panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
    .panel-head h2, .panel-head h3 { margin: 0; font-size: 15px; letter-spacing: -.01em; }
    .panel-head p { margin: 6px 0 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .panel-body { padding: 18px 20px; }
    .status-chip { white-space: nowrap; border: 1px solid rgba(66, 210, 174, .4); background: var(--teal-dark); color: var(--teal); border-radius: 999px; padding: 5px 8px; font: 10px var(--mono); }
    .idea-input { width: 100%; min-height: 102px; resize: vertical; border: 1px solid var(--line); border-radius: 6px; background: #161e20; color: var(--text); padding: 12px; line-height: 1.55; }
    .action-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 13px; }
    .small-note { color: var(--muted); font-size: 11px; line-height: 1.45; }
    .split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .subpanel { border: 1px solid var(--line); border-radius: 6px; padding: 13px; background: rgba(255, 255, 255, .02); }
    .subpanel h4 { margin: 0 0 8px; font-size: 12px; }
    .subpanel p, .subpanel li { color: #c1cdcc; font-size: 12px; line-height: 1.55; }
    .subpanel p { margin: 0; }
    .subpanel ul { margin: 0; padding-left: 17px; }
    .list { display: grid; gap: 9px; margin: 0; padding: 0; list-style: none; }
    .list li { display: flex; gap: 9px; align-items: flex-start; color: #c1cdcc; font-size: 12px; line-height: 1.45; }
    .list li::before { content: ""; flex: 0 0 6px; height: 6px; margin-top: 6px; border-radius: 50%; background: var(--coral); }
    .id { font-family: var(--mono); color: var(--yellow); font-size: 10px; }
    .code { background: #101617; border: 1px solid #314044; border-radius: 6px; padding: 13px; color: #ccefe4; font: 11px/1.65 var(--mono); white-space: pre-wrap; }
    .metric-line { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(58, 72, 75, .62); font-size: 12px; }
    .metric-line:last-child { border-bottom: 0; }
    .metric-line span:first-child { color: var(--muted); }
    .metric-line strong { color: var(--text); font-weight: 650; text-align: right; }
    .check-list { display: grid; gap: 11px; }
    .check { display: flex; gap: 10px; align-items: flex-start; color: #c1cdcc; font-size: 12px; line-height: 1.45; cursor: pointer; }
    .check input { accent-color: var(--teal); margin-top: 2px; }
    .artifact-list { display: grid; gap: 8px; }
    .artifact { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-bottom: 1px solid rgba(58, 72, 75, .62); padding: 0 0 9px; }
    .artifact:last-child { border-bottom: 0; padding-bottom: 0; }
    .artifact span { color: #c1cdcc; font-size: 12px; }
    .artifact code { color: var(--blue); font: 10px var(--mono); }
    .footer-bar { display: flex; justify-content: space-between; gap: 20px; margin-top: 18px; color: var(--muted); font-size: 11px; }
    .toast { position: fixed; right: 24px; bottom: 22px; border: 1px solid rgba(66, 210, 174, .45); background: #102a25; color: var(--teal); border-radius: 6px; padding: 11px 14px; font-size: 12px; opacity: 0; transform: translateY(7px); pointer-events: none; transition: opacity .2s ease, transform .2s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .table th, .table td { border-bottom: 1px solid rgba(58, 72, 75, .65); padding: 10px 8px; text-align: left; vertical-align: top; }
    .table th { color: var(--muted); font-weight: 500; }
    .table td { color: #d4dfdd; line-height: 1.4; }
    .pass { color: var(--teal); font-family: var(--mono); font-size: 10px; }
    .flow { display: grid; gap: 8px; }
    .flow-step { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; }
    .flow-index { width: 24px; height: 24px; border: 1px solid var(--teal); color: var(--teal); border-radius: 50%; display: grid; place-items: center; font: 11px var(--mono); }
    .flow-step strong { display: block; font-size: 12px; }
    .flow-step span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; line-height: 1.4; }

    @media (max-width: 900px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .main { padding: 20px 16px 30px; }
      .content-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 620px) {
      .topbar { flex-direction: column; }
      .top-actions { width: 100%; }
      .top-actions .mode, .top-actions .primary { flex: 1; }
      .stage-rail { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stage:nth-child(2) { border-right: 0; }
      .stage:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
      .split { grid-template-columns: 1fr; }
      .footer-bar { flex-direction: column; gap: 6px; }
    }
  </style>
</head>
<body>
  <div class="app-shell" id="workbench">
    <aside class="sidebar" aria-label="工作台导航">
      <div class="brand">
        <div class="brand-mark">V</div>
        <div><div class="brand-title">Vibe Coding</div><div class="brand-sub">规范化操作 · Demo</div></div>
      </div>
      <div>
        <div class="nav-label" style="padding:0 12px 8px">工作台</div>
        <nav class="nav">
          <button class="active" type="button"><span class="nav-dot"></span>流程总览</button>
          <button type="button"><span class="nav-dot"></span>我的任务</button>
          <button type="button"><span class="nav-dot"></span>交付物</button>
        </nav>
      </div>
      <div class="assignment">
        <div class="nav-label">本次个人任务</div>
        <strong>把一个真实工作想法走过四个阶段</strong>
        <p>先把“想做什么”说清楚，再决定要不要增加工程化深度。</p>
        <div class="mini-progress"><span id="task-progress"></span></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow">个人工作台 / TRAINING DEMO</div>
          <h1>从工作想法到可交付结果</h1>
          <p>用同一条业务案例，走一遍 PRD → Design → TDD → Coding Agent。</p>
        </div>
        <div class="top-actions">
          <label class="mode"><span class="mode-label">交付模式</span><select id="mode-select" aria-label="交付模式"><option value="quick">Quick · 快速验证</option><option value="standard">Standard · 正式交接</option></select></label>
          <button class="primary" type="button" id="recommend-btn">继续用 AI 推荐 →</button>
        </div>
      </header>

      <section class="stage-rail" aria-label="流程阶段">
        <button class="stage active" type="button" data-stage="prd"><span class="stage-num">01</span><span class="stage-name">PRD</span><span class="stage-hint">把想法说成产品草图</span></button>
        <button class="stage" type="button" data-stage="design"><span class="stage-num">02</span><span class="stage-name">Design</span><span class="stage-hint">把草图变成施工图</span></button>
        <button class="stage" type="button" data-stage="tdd"><span class="stage-num">03</span><span class="stage-name">TDD</span><span class="stage-hint">定义怎么算做完</span></button>
        <button class="stage" type="button" data-stage="coding"><span class="stage-num">04</span><span class="stage-name">Coding Agent</span><span class="stage-hint">按契约实现与演示</span></button>
      </section>

      <section class="content-grid">
        <div class="panel" id="stage-panel"></div>
        <aside class="panel" id="right-panel"></aside>
      </section>

      <footer class="footer-bar">
        <span id="stage-status">当前阶段：PRD · 产品草图</span>
        <span>演示案例：客户跟进工作台</span>
      </footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const state = { stage: 'prd', mode: 'quick', generated: { prd: false, design: false, tdd: false, coding: false } };
    const taskChecks = ['idea', 'prd', 'design', 'tdd'];

    const stageMeta = {
      prd: { label: 'PRD · 产品草图', action: '生成本轮 PRD 草图' },
      design: { label: 'Design · 页面施工图', action: '生成本轮 Design 草图' },
      tdd: { label: 'TDD · 验收契约', action: '生成本轮 TDD 契约' },
      coding: { label: 'Coding Agent · 交接', action: '生成交接提示词' }
    };

    const stagePanel = document.getElementById('stage-panel');
    const rightPanel = document.getElementById('right-panel');
    const toast = document.getElementById('toast');

    function escapeHtml(value) {
      return value.replace(/[&<>'"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[ch]));
    }

    function taskPanel() {
      return `<div class="panel-head"><div><h3>个人工作台任务</h3><p>把自己的真实任务填进来，不追求一次写完。</p></div><span class="status-chip">练习任务</span></div>
        <div class="panel-body"><div class="check-list">
          <label class="check"><input type="checkbox" data-task="idea">我能用一句话说清要做什么</label>
          <label class="check"><input type="checkbox" data-task="prd">我确认了产品草图和 MVP 边界</label>
          <label class="check"><input type="checkbox" data-task="design">我能指出核心页面和关键状态</label>
          <label class="check"><input type="checkbox" data-task="tdd">我知道哪些结果必须真实验证</label>
        </div>
        <div class="action-row"><span class="small-note">完成一项就勾选一项；不用等全部文档写完。</span><button class="secondary" type="button" id="reset-task">重置任务</button></div></div>`;
    }

    function artifactsPanel() {
      const items = [
        ['产品草图', 'output/产品草图.md', state.generated.prd],
        ['页面施工图', 'output/pages/*.md', state.generated.design],
        ['验收契约', 'output/tests/TDD验收契约.md', state.generated.tdd],
        ['Agent 交接', 'handoff/prompt.md', state.generated.coding]
      ];
      return `<div class="panel-head"><div><h3>当前交付物</h3><p>只显示本轮真正需要的产物。</p></div><span class="status-chip">${state.mode}</span></div><div class="panel-body"><div class="artifact-list">${items.map(item => `<div class="artifact"><span>${item[0]}</span><code>${item[2] ? 'READY' : 'NEXT'} · ${item[1]}</code></div>`).join('')}</div></div>`;
    }

    function renderPrd() {
      return `<div class="panel-head"><div><div class="eyebrow">阶段 01 / 先理解，再决定</div><h2>PRD：先确认“我想做出的东西”</h2><p>AI 先回放、给推荐，只追问会改变产品边界的问题。</p></div><span class="status-chip">${state.mode.toUpperCase()}</span></div>
      <div class="panel-body"><label class="eyebrow" for="idea">一句话工作想法</label><textarea class="idea-input" id="idea">我想要一个客户跟进工作台，让我每天打开就知道哪些客户该联系、上次聊了什么、下一步是什么。</textarea>
      <div class="action-row"><span class="small-note">默认采用 AI 推荐；不同意时只指出哪一处不像。</span><button class="primary" type="button" data-generate="prd">${stageMeta.prd.action} →</button></div>
      <div class="split" style="margin-top:18px"><div class="subpanel"><h4>产品草图 · V1</h4><ul class="list"><li><span><b>用户：</b>需要持续跟进客户的人</span></li><li><span><b>触发：</b>每天开始工作或客户状态变化</span></li><li><span><b>结果：</b>知道今天联系谁、说什么、下一步是什么</span></li><li><span><b>MVP：</b>客户列表、跟进记录、今日行动</span></li></ul></div><div class="subpanel"><h4>AI 推荐 · 只确认关键分叉</h4><p>先做一个“今日行动”闭环：列表 → 客户详情 → 记录下一步。暂不加入自动评分、复杂报表和跨系统同步。</p><div class="id" style="margin-top:10px">TASK-01 · DONE-01 · RISK-01</div></div></div></div>`;
    }

    function renderDesign() {
      return `<div class="panel-head"><div><div class="eyebrow">阶段 02 / 把想法翻译成施工图</div><h2>Design：页面、状态和流转先走通</h2><p>不先争论颜色和框架，先保证用户任务能完成。</p></div><span class="status-chip">PAGE-01 → PAGE-03</span></div>
      <div class="panel-body"><div class="flow"><div class="flow-step"><div class="flow-index">1</div><div><strong>今日行动列表</strong><span>显示客户、优先级、最近一次跟进和下一步动作。</span></div></div><div class="flow-step"><div class="flow-index">2</div><div><strong>客户详情页</strong><span>把历史沟通和本次跟进动作放在同一视线内。</span></div></div><div class="flow-step"><div class="flow-index">3</div><div><strong>记录结果</strong><span>成功、失败、空状态和重复提交都要有可观察反馈。</span></div></div></div><div class="split" style="margin-top:18px"><div class="subpanel"><h4>页面清单</h4><div class="metric-line"><span>PAGE-01</span><strong>今日行动 · MVP</strong></div><div class="metric-line"><span>PAGE-02</span><strong>客户详情 · MVP</strong></div><div class="metric-line"><span>PAGE-03</span><strong>跟进记录 · MVP</strong></div></div><div class="subpanel"><h4>设计决策</h4><ul class="list"><li><span>先做单人闭环，不引入团队协作权限</span></li><li><span>记录结果必须可回看、可修正</span></li><li><span>需要标准交接时再生成 HTML 与技术方案</span></li></ul></div></div><div class="action-row"><span class="small-note">页面施工图从 templates/page.md 起步。</span><button class="primary" type="button" data-generate="design">${stageMeta.design.action} →</button></div></div>`;
    }

    function renderTdd() {
      return `<div class="panel-head"><div><div class="eyebrow">阶段 03 / 先定义怎么算完成</div><h2>TDD：把“应该可以”变成证据</h2><p>业务人员只确认结果；AI 选择最低成本的验证方式。</p></div><span class="status-chip">5 条契约</span></div>
      <div class="panel-body"><table class="table"><thead><tr><th>ID</th><th>场景</th><th>通过标准</th><th>验证</th></tr></thead><tbody><tr><td class="id">SMOKE-01</td><td>打开今日行动</td><td>列表可访问，无阻断错误</td><td class="pass">命令 + 入口</td></tr><tr><td class="id">FLOW-01</td><td>查看客户并记录跟进</td><td>记录成功，返回详情可见</td><td class="pass">浏览器操作</td></tr><tr><td class="id">DESIGN-01</td><td>今日行动页面</td><td>结构、内容、入口与施工图一致</td><td class="pass">截图对 + 看图</td></tr><tr><td class="id">RULE-01</td><td>重复提交</td><td>不会生成重复记录</td><td class="pass">真实回归</td></tr><tr><td class="id">RISK-01</td><td>客户数据</td><td>仅本人可见，失败不留半成品</td><td class="pass">权限/数据证据</td></tr></tbody></table><div class="action-row"><span class="small-note">所有条目初始为 pending；没有本轮证据就不能写 pass。</span><button class="primary" type="button" data-generate="tdd">${stageMeta.tdd.action} →</button></div></div>`;
    }

    function renderCoding() {
      return `<div class="panel-head"><div><div class="eyebrow">阶段 04 / 交给 Coding Agent</div><h2>交接：让 Agent 按范围和证据工作</h2><p>把产品草图、页面施工图和验收契约一起交出去。</p></div><span class="status-chip">READY TO HANDOFF</span></div>
      <div class="panel-body"><div class="code">任务：实现客户跟进工作台的 MVP 闭环。
范围：今日行动列表 → 客户详情 → 记录下一步。
必须遵守：不新增自动评分、复杂报表、跨系统同步。
完成标准：逐条执行 TDD 验收契约，并记录真实命令、页面操作和截图证据。
遇到需求冲突：停止猜测，回到 PRD/Design 修订。</div><div class="split" style="margin-top:16px"><div class="subpanel"><h4>交接前检查</h4><ul class="list"><li><span>PRD/Design/TDD 的模式字段一致</span></li><li><span>MVP 页面和验收 ID 可追踪</span></li><li><span>所有外部依赖已有责任人</span></li></ul></div><div class="subpanel"><h4>完成不是“代码写完”</h4><p>完成 = 真实业务闭环可操作 + 验收条目全部有证据 + 发现偏差时知道回到哪一层修订。</p></div></div><div class="action-row"><span class="small-note">下一步：把这段交接内容复制到 Codex、Word Buddy 或其他 Agent。</span><button class="primary" type="button" data-generate="coding">${stageMeta.coding.action} →</button></div></div>`;
    }

    function renderRight() {
      rightPanel.innerHTML = taskPanel() + artifactsPanel();
      rightPanel.querySelectorAll('[data-task]').forEach(input => input.addEventListener('change', updateTaskProgress));
      rightPanel.querySelector('#reset-task').addEventListener('click', () => { rightPanel.querySelectorAll('[data-task]').forEach(input => { input.checked = false; }); updateTaskProgress(); });
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function updateTaskProgress() {
      const done = [...rightPanel.querySelectorAll('[data-task]')].filter(input => input.checked).length;
      document.getElementById('task-progress').style.width = `${done * 25}%`;
    }

    function renderStage(stage) {
      state.stage = stage;
      document.querySelectorAll('[data-stage]').forEach(button => button.classList.toggle('active', button.dataset.stage === stage));
      stagePanel.innerHTML = stage === 'prd' ? renderPrd() : stage === 'design' ? renderDesign() : stage === 'tdd' ? renderTdd() : renderCoding();
      renderRight();
      document.getElementById('stage-status').textContent = `当前阶段：${stageMeta[stage].label}`;
      stagePanel.querySelectorAll('[data-generate]').forEach(button => button.addEventListener('click', () => { state.generated[button.dataset.generate] = true; renderRight(); showToast(`${stageMeta[button.dataset.generate].label} 已加入当前交付物`); }));
    }

    document.querySelectorAll('[data-stage]').forEach(button => button.addEventListener('click', () => renderStage(button.dataset.stage)));
    document.getElementById('mode-select').addEventListener('change', event => { state.mode = event.target.value; renderStage(state.stage); showToast(`已切换到 ${state.mode === 'quick' ? 'Quick 快速验证' : 'Standard 正式交接'}`); });
    document.getElementById('recommend-btn').addEventListener('click', () => showToast('继续采用 AI 推荐，只在关键分叉处确认')); 
    renderStage('prd');
  </script>
</body>
</html>
